name: ci

on: [pull_request] # yamllint disable-line rule:truthy

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read
  checks: write # Used to annotate code in the PR
  pull-requests: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
      - name: build
        run: |
          make build
  linting:
    needs: [build]
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
      - name: gofmt
        run: |
          gofmt_out=$(gofmt -d $(find * -name '*.go' ! -path 'vendor/*'))
          if [[ -n "$gofmt_out" ]]; then
              failed=1
          fi
          echo "$gofmt_out"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.0
          
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
      - name: tests
        run: |
          make test

  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: "go.mod"
      - name: Install Kind
        run: |
          go install sigs.k8s.io/kind@v0.27.0
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      - name: Create E2E test database
        run: |
          cd test/e2e/scripts
          ./rds-lifecycle.sh create
          ./rds-lifecycle.sh seed
      - name: Run E2E tests
        env:
          E2E_FIVETRAN_API_KEY: ${{ secrets.E2E_FIVETRAN_API_KEY }}
          E2E_FIVETRAN_API_SECRET: ${{ secrets.E2E_FIVETRAN_API_SECRET }}
          E2E_FIVETRAN_GROUP_ID: ${{ vars.E2E_FIVETRAN_GROUP_ID }}
          E2E_GOOGLE_SHEET_ID: ${{ vars.E2E_GOOGLE_SHEET_ID }}
          E2E_GOOGLE_NAMED_RANGE: ${{ vars.E2E_GOOGLE_NAMED_RANGE }}
          CONTAINER_TOOL: docker
        run: |
          source test/e2e/scripts/.rds-state.env
          export E2E_POSTGRES_HOST="${RDS_ENDPOINT}"
          export E2E_POSTGRES_PASSWORD="${FIVETRAN_USER_PASSWORD}"
          make test-e2e
      - name: Destroy E2E test database
        if: always()
        run: |
          cd test/e2e/scripts
          ./rds-lifecycle.sh destroy
